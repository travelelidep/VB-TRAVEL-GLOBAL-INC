services:
  - type: web
    name: vb-travel-global
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://vbtravelglobal.com
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        value: "58416111157"
      - key: NEXT_PUBLIC_EMAIL
        value: "vbtravelglobal@gmail.com"
      # --- Célula de agentes IA ---
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: CRON_SECRET
        generateValue: true
      # Persistencia opcional del estado de los agentes (Upstash Redis)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Integraciones
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: sistema@vbtravelglobal.com

  # Bucle autónomo: procesa la cola de tareas de los agentes cada 15 minutos.
  - type: cron
    name: vb-agents-automation
    runtime: node
    plan: starter
    region: oregon
    branch: main
    schedule: "*/15 * * * *"
    buildCommand: ""
    startCommand: node scripts/automation-tick.mjs
    envVars:
      - key: AGENTS_BASE_URL
        fromService:
          type: web
          name: vb-travel-global
          envVarKey: RENDER_EXTERNAL_URL
      - key: CRON_SECRET
        fromService:
          type: web
          name: vb-travel-global
          envVarKey: CRON_SECRET
